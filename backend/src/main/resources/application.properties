#Database configuration

#Url for the database connection
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST:localhost}:${MYSQL_ADDON_PORT:3306}/${MYSQL_ADDON_DB:tempum_db}?createDatabaseIfNotExist=true

#Username for the database connection
spring.datasource.username=${MYSQL_ADDON_USER:root}

#Password for the database connection
spring.datasource.password=${MYSQL_ADDON_PASSWORD:root}

#Hibernate configuration ORM configuration
#Dialect for MySQL database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# CORS configuration
# Si existe la variable de entorno APP_CORS_ALLOWED_ORIGINS, usa su valor. Si no, usa http://localhost:5173 por defecto.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT secret key configuration
app.jwt.secret=${JWT_SECRET_KEY:J8u#1m!S0ftw@r3_T3mpum_P4ssw0rd_2026_Secur3Key}