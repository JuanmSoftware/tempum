      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Stylized calendar board -->
  <rect x="48" y="48" width="416" height="416" rx="112" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Internal calendar sheets / grid style -->
